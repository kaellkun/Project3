<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <title>リリリリ</title>
    </head>
    <body style="background-color: black">
        <script type="text/javascript">
            (() => {
                const cacheBuster = String(Date.now());
                window.__Project3CacheBuster = cacheBuster;
                // A static <link> would be fetched unversioned before this runs.
                const stylesheet = document.createElement("link");
                stylesheet.rel = "stylesheet";
                stylesheet.type = "text/css";
                stylesheet.href = `css/game.css?v=${cacheBuster}`;
                document.head.appendChild(stylesheet);
                const script = document.createElement("script");
                script.type = "text/javascript";
                script.src = `js/main.js?v=${cacheBuster}`;
                document.body.appendChild(script);
            })();
        </script>
    </body>
</html>
